<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kerala Official Ticket Booking Portal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            margin: 0;
            padding: 15px;
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .portal-container {
            background: #ffffff;
            color: #333;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }
        /* Header & Logo */
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        .logo-icon {
            font-size: 40px;
            margin-bottom: 5px;
        }
        .header h2 {
            color: #007bff;
            margin: 0;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }
        .datetime {
            font-size: 12px;
            color: #0284c7;
            margin-top: 5px;
            font-weight: 700;
        }
        /* Ticket Type Selection */
        .ticket-type-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .type-card {
            flex: 1;
            border: 2px solid #bae6fd;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f0f9ff;
        }
        .type-card.active {
            border-color: #0284c7;
            background: #e0f2fe;
        }
        .type-card h4 {
            margin: 0 0 3px 0;
            color: #0369a1;
            font-size: 14px;
        }
        .type-card .price {
            color: #dc2626;
            font-weight: bold;
            font-size: 15px;
        }
        /* Main Featured Ticket Box */
        .ticket {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            border-radius: 12px;
            padding: 15px;
            position: relative;
            box-shadow: 0 6px 15px rgba(59, 130, 246, 0.3);
            margin-bottom: 15px;
            text-align: center;
        }
        .ticket-number {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px;
            border-radius: 8px;
            display: inline-block;
            border: 1px dashed rgba(255, 255, 255, 0.6);
            margin: 8px 0;
            word-break: break-all;
        }
        /* 100 Tickets Grid Section */
        .grid-section-title {
            font-size: 13px;
            font-weight: bold;
            color: #0369a1;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ticket-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            max-height: 160px;
            overflow-y: auto;
            background: #f0f9ff;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #bae6fd;
            margin-bottom: 15px;
        }
        .grid-item {
            background: #ffffff;
            border: 1px solid #7dd3fc;
            padding: 6px 4px;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            color: #0284c7;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }
        .grid-item:hover {
            background: #e0f2fe;
        }
        .grid-item.selected {
            background: #0284c7;
            color: white;
            border-color: #0369a1;
        }
        /* Buttons */
        .btn {
            background-color: #f59e0b;
            color: white;
            border: none;
            padding: 10px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 8px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #d97706;
        }
        .whatsapp-btn {
            background-color: #10b981;
        }
        .whatsapp-btn:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

    <div class="portal-container">
        <!-- Header & Logo -->
        <div class="header">
            <div class="logo-icon">🎟️</div>
            <h2>Welcome to Kerala Lottery Tickets</h2>
            <div class="datetime" id="liveDateTime">Loading Date & Time...</div>
        </div>

        <!-- Ticket Category Cards -->
        <div class="ticket-type-selector">
            <div class="type-card active" id="normalCard" onclick="selectTicketType('Normal', 49)">
                <h4>Normal Ticket</h4>
                <div class="price">Rs/49</div>
            </div>
            <div class="type-card" id="premiumCard" onclick="selectTicketType('Premium', 149)">
                <h4>Premium Ticket</h4>
                <div class="price">Rs/149</div>
            </div>
        </div>

        <!-- Featured Selected Ticket Box -->
        <div class="ticket">
            <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.9;" id="selectedCategoryTitle">NORMAL TICKET (Rs/49)</div>
            <div class="ticket-number" id="ticketDisplay">No ticket selected</div>
            <div style="font-size: 11px; opacity: 0.9;" id="selectionCount">Selected: 0 tickets</div>
        </div>

        <!-- 100 Tickets Grid View -->
        <div class="grid-section-title">
            <span>Available Active Tickets (100)</span>
            <span style="font-size: 11px; color: #0284c7;">Tap multiple to select</span>
        </div>
        <div class="ticket-grid" id="ticketGridContainer">
            <!-- Dynamic 100 tickets will load here -->
        </div>

        <!-- Action Buttons -->
        <button class="btn" onclick="generateAllTickets()">Refresh All Tickets</button>
        <button class="btn whatsapp-btn" onclick="sendToWhatsApp()">Send Selected to WhatsApp (7061373557)</button>
    </div>

    <script>
        let currentType = "Normal";
        let currentPrice = 49;
        let selectedTickets = [];

        // Real-time Date & Time Function
        function updateDateTime() {
            const now = new Date();
            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('liveDateTime').innerText = now.toLocaleDateString('en-IN', options);
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        function selectTicketType(type, price) {
            currentType = type;
            currentPrice = price;
            selectedTickets = []; // Category change par reset

            if(type === 'Normal') {
                document.getElementById('normalCard').classList.add('active');
                document.getElementById('premiumCard').classList.remove('active');
                document.getElementById('selectedCategoryTitle').innerText = "NORMAL TICKET (Rs/49)";
            } else {
                document.getElementById('premiumCard').classList.add('active');
                document.getElementById('normalCard').classList.remove('active');
                document.getElementById('selectedCategoryTitle').innerText = "PREMIUM TICKET (Rs/149)";
            }
            generateAllTickets();
        }

        // Generate 100 Tickets
        function generateAllTickets() {
            selectedTickets = [];
            const prefix = currentType === 'Premium' ? 'KLP' : 'KL';
            const gridContainer = document.getElementById('ticketGridContainer');
            gridContainer.innerHTML = '';

            for (let i = 0; i < 100; i++) {
                const randomNum = Math.floor(100000 + Math.random() * 900000);
                const ticketStr = `${prefix} ${randomNum}`;

                const item = document.createElement('div');
                item.className = 'grid-item';
                item.innerText = ticketStr;
                item.onclick = () => toggleTicketSelection(ticketStr, item);
                gridContainer.appendChild(item);
            }
            updateDisplay();
        }

        function toggleTicketSelection(ticketStr, element) {
            const index = selectedTickets.indexOf(ticketStr);
            if (index > -1) {
                // Agar pehle se selected hai toh hata do
                selectedTickets.splice(index, 1);
                element.classList.remove('selected');
            } else {
                // Naya select kar lo (Multiple allowed)
                selectedTickets.push(ticketStr);
                element.classList.add('selected');
            }
            updateDisplay();
        }

        function updateDisplay() {
            if (selectedTickets.length > 0) {
                document.getElementById('ticketDisplay').innerText = selectedTickets.join(', ');
                document.getElementById('selectionCount').innerText = `Selected: ${selectedTickets.length} ticket(s) | Total: Rs/${selectedTickets.length * currentPrice}`;
            } else {
                document.getElementById('ticketDisplay').innerText = "No ticket selected";
                document.getElementById('selectionCount').innerText = "Selected: 0 tickets";
            }
        }

        function sendToWhatsApp() {
            if (selectedTickets.length === 0) {
                alert("Kam se kam ek ticket select karein!");
                return;
            }

            const phoneNumber = "917061373557"; 
            const totalAmount = selectedTickets.length * currentPrice;
            const message = `Hello, maine ${currentType} Ticket category se ${selectedTickets.length} tickets select kiye hain.\n\nTicket Numbers: ${selectedTickets.join(', ')}\nTotal Amount: Rs/${totalAmount}`;
            
            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }

        // Initial load
        window.onload = generateAllTickets;
    </script>

</body>
</html>
